# Spec §9.2 — "Bring N, ban 1". Identical to base with three modules prepended.
#
# Sequence: **ban first**, both blind -> reveal both bans -> draft against that knowledge
# (hidden) -> reveal picks -> the round loop.
#
# **The ban moved in front of the draft (2026-07-31), and that resolves O6.** It used to sit
# alongside the draft: you committed picks and a ban together, so the ban was a guess about what
# the opponent had brought. At a 45-character roster that guess landed about `draftCount/45` of
# the time — roughly 9% at 4, so it whiffed nine times in ten and the mode's headline mechanic
# was mostly a coin that came up tails. Banning first makes it certain: the character is gone
# from their pool before they choose, so the ban always does something.
#
# Two consequences worth stating, because neither is obvious:
#
#   - **CONDITIONAL_RECOMMIT is gone.** It existed only to repair a draft that a blind ban had
#     hit. Ban before drafting and there is nothing to repair — the module had no reason left to
#     exist, so it was removed rather than left in as a no-op.
#   - **The pool needed no change at all.** `legalDraftPool` already reads
#     `activeRoster \ globalBanned \ metaBannedAgainst[seat] \ selfHeld`, so the ban term was
#     there the whole time and simply evaluated empty at draft time. §6's bet — "every draft rule
#     is a set expression, adding a mode should never require new pool code" — collected here.
#
# The ban stays `OPPONENT_ONLY` (D4). It does not remove a character from the match, it removes
# it from *them*: with mirrors allowed (D1) you may still draft the character you just banned,
# which is the "steal" line and is now a live option rather than a coincidence.
schemaVersion: 1
mode: bring-ban1
label: 'Bring ${draftCount}, Ban 1'

parameters:
  draftCount:
    values: [3, 4]
    default: 4
    label: 'Characters drafted'

modules:
  # Phase one: the ban, blind on both sides, revealed the moment both are in.
  - use: SIMULTANEOUS_COMMIT
    id: ban
    commits:
      metaBan:
        count: 1
        pool: legalMetaBanPool # activeRoster \ globalBanned — so a meta ban cannot be
        tier: META #             wasted on an already globally banned character
        targets: OPPONENT_ONLY # D4 — scoped to one opponent seat, so no self-own is possible
    reveal:
      metaBan: IMMEDIATE

  # Phase two: the draft, now played against a known ban. `legalDraftPool` subtracts
  # `metaBannedAgainst[seat]` on its own — see the note above.
  - use: SIMULTANEOUS_COMMIT
    id: draft
    commits:
      picks:
        # The spec had this hardcoded at 4 while declaring the parameter — reconciled 2026-07-28.
        count: ${draftCount}
        pool: legalDraftPool
        crossSeatMirrors: ALLOWED # D1
        selfDuplicates: FORBIDDEN # D12
    reveal:
      picks: DEFERRED # opened by pickReveal, below

  - use: REVEAL
    id: pickReveal
    slices: [slots]

  - use: ROUND_LOOP
    id: rounds
    count: 3
    template:
      - use: ROLL
        id: roll
        dice: 1d6
        actors: BOTH
        resolve: HIGHEST
        onTie: REROLL

      - use: CHOOSE
        id: privilegeChoice
        actor: rollWinner
        options: [DRAFT_PRIVILEGE, TURN_ORDER]
        loserGets: COMPLEMENT

      - use: BAN
        id: ban
        tier: ROUND
        actor: privilegeHolder
        pool: legalRoundBan

      - use: SELECT
        id: selectFirst
        mode: SEQUENTIAL
        actor: opponent
        pool: legalRoundPick

      - use: SELECT
        id: selectSecond
        mode: SEQUENTIAL
        actor: privilegeHolder
        pool: legalRoundPick

      - use: CHOOSE
        id: declareOrder
        actor: turnOrderHolder
        options: [SELF_FIRST, OPPONENT_FIRST]

      - use: REPORT_RESULT
        id: report
        allowTie: true

    overrides:
      1:
        remove: [roll, privilegeChoice]
        insert:
          - use: ASSIGN
            id: invert
            privilegeHolder: INVERT_PREVIOUS
            turnOrderHolder: INVERT_PREVIOUS
        # **The banned player picks first, in every round.**
        #
        # This used to read `[privilegeHolder, opponent]`, inverting round 0 so that the *banner*
        # chose first here. §9.3 argued that as a counterweight: round 1's ban bites harder, so
        # the last-pick information advantage moved to the other seat to compensate.
        #
        # Changed 2026-07-31 on the owner's call, after playing it. The rule the table expects is
        # the simple one — you ban, they answer, you counter-pick — and having that reverse in the
        # middle round read as a bug rather than as compensation. A counterweight nobody can feel
        # is not balancing anything; it is just an inconsistency with a footnote.
        selectOrder: [opponent, privilegeHolder]

      2:
        remove: [privilegeChoice, ban]
        rollAssigns: TURN_ORDER
        select:
          mode: SIMULTANEOUS_HIDDEN
          actor: BOTH
          pool: legalRoundPick

onTie:
  scoring: HALF_POINT
  consumesCharacters: true

match:
  resolution: ALWAYS_3_ROUNDS
  stopWhenDecided: true

overtime:
  enabled: false
